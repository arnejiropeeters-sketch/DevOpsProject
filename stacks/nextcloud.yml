  # ==========================================
  # SERVICE 3: nextcloud drive
  # ==========================================

services:
  nextcloud-db-init:
    image: postgres:16-alpine
    container_name: service3_nextcloud_db_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_DB_NAME=${NEXTCLOUD_DB_NAME}
      - NEXTCLOUD_DB_USER=${NEXTCLOUD_DB_USER}
      - NEXTCLOUD_DB_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    command:
      - sh
      - -c
      - |
        psql -h service2_postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 <<EOF
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${NEXTCLOUD_DB_USER}') THEN
            CREATE USER "${NEXTCLOUD_DB_USER}" WITH PASSWORD '${NEXTCLOUD_DB_PASSWORD}';
          END IF;
        END
        \$\$;

        SELECT 'CREATE DATABASE "${NEXTCLOUD_DB_NAME}" OWNER "${NEXTCLOUD_DB_USER}"'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${NEXTCLOUD_DB_NAME}')\gexec

        GRANT ALL PRIVILEGES ON DATABASE "${NEXTCLOUD_DB_NAME}" TO "${NEXTCLOUD_DB_USER}";
        EOF
    networks:
      - proxy-net

  nextcloud:
    image: nextcloud:apache
    container_name: service3_nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db-init:
        condition: service_completed_successfully
    environment:
      - POSTGRES_HOST=service2_postgres
      - POSTGRES_DB=${NEXTCLOUD_DB_NAME}
      - POSTGRES_USER=${NEXTCLOUD_DB_USER}
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - OVERWRITEPROTOCOL=http
      - OVERWRITEHOST=${DOMAIN}
      - OVERWRITEWEBROOT=${NEXTCLOUD_PATH}
      - NEXTCLOUD_TRUSTED_DOMAINS=${DOMAIN} localhost 127.0.0.1
    volumes:
      - ../service3/nextcloud-data:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${DOMAIN}`) && PathPrefix(`${NEXTCLOUD_PATH}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.middlewares.strip-nextcloud.stripprefix.prefixes=${NEXTCLOUD_PATH}"
      - "traefik.http.routers.nextcloud.middlewares=strip-nextcloud"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.http.routers.nextcloud.tls=true"
    networks:
      - proxy-net
      
networks:
  proxy-net:
    name: proxy-net
    driver: bridge