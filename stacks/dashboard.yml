services:
    dashboard:
        image: nginx:alpine
        container_name: devops_dashboard
        volumes:
          - ../apps/dashboard/index.html:/usr/share/nginx/html/index.html:ro
          - ../apps/dashboard/config.js.template:/etc/nginx/templates/config.js.template:ro
        networks:
          - proxy-net
        labels:
          - "traefik.enable=true"
          - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)"
          - "traefik.http.routers.dashboard.entrypoints=websecure"
          - "traefik.http.routers.dashboard.tls=true"
          - "traefik.http.routers.dashboard.priority=1"
          - "traefik.http.services.dashboard.loadbalancer.server.port=80"
        environment:
          - DOMAIN=${DOMAIN:-192.168.0.213}
          - VAULT_PATH=${VAULT_PATH}
          - QBIT_PATH=${QBIT_PATH}
          - SONARR_PATH=${SONARR_PATH}
          - RADARR_PATH=${RADARR_PATH}
          - PROWLARR_PATH=${PROWLARR_PATH}
          - SEERR_PATH=${SEERR_PATH}
          - JELLYFIN_PATH=${JELLYFIN_PATH}
          - NEXTCLOUD_PATH=${NEXTCLOUD_PATH}
          - MINIATURES_APP_PATH=${MINIATURES_APP_PATH}
        command: >
          sh -c "apk add --no-cache gettext >/dev/null 2>&1 && envsubst < /etc/nginx/templates/config.js.template > /usr/share/nginx/html/config.js && exec nginx -g 'daemon off;'"