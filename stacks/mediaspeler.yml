  # ==========================================
  # SERVICE 1: MEDIA STACK 
  # ==========================================
  services:
    qbit-init:
        image: python:3.12-alpine
        container_name: service1_qbit_init
        environment:
          - QBIT_PASS=${QBIT_PASS}
        volumes:
          - ../service1/qbit/config:/config
        command:
          - sh
          - -c
          - |
            python3 - << 'EOF'
            import os, hashlib, base64, configparser
            conf_dir = "/config/qBittorrent"
            conf_file = os.path.join(conf_dir, "qBittorrent.conf")
            os.makedirs(conf_dir, exist_ok=True)
            pw = os.environ["QBIT_PASS"].encode()
            salt = os.urandom(16)
            dk = hashlib.pbkdf2_hmac("sha512", pw, salt, 100000, dklen=64)
            pbkdf2_val = f"@ByteArray({base64.b64encode(salt).decode()}:{base64.b64encode(dk).decode()})"
            cfg = configparser.RawConfigParser()
            cfg.optionxform = str
            if os.path.exists(conf_file):
                cfg.read(conf_file)
            if "Preferences" not in cfg:
                cfg["Preferences"] = {}
            cfg["Preferences"]["WebUI\\Username"] = "admin"
            cfg["Preferences"]["WebUI\\Password_PBKDF2"] = pbkdf2_val
            cfg["Preferences"]["WebUI\\CSRFProtection"] = "false"
            cfg["Preferences"]["WebUI\\HostHeaderValidation"] = "false"
            cfg["Preferences"]["WebUI\\HTTPS\\Enabled"] = "false"
            with open(conf_file, "w") as f:
                cfg.write(f, space_around_delimiters=False)
            os.chown(conf_dir, 1000, 1000)
            os.chown(conf_file, 1000, 1000)
            EOF
    media-init:
      image: alpine:latest
      container_name: service1_media_init
      volumes:
        - ../service1/media:/media
      command:
        - sh
        - -c
        - |
          mkdir -p /media/movies /media/downloads
          chown -R 1000:1000 /media
          chmod -R u+rwX,g+rwX /media
    stack-init:
      image: curlimages/curl:latest
      container_name: service1_stack_init
      depends_on:
        media-init:
            condition: service_completed_successfully
        radarr:
          condition: service_started
        prowlarr:
          condition: service_started
        qbittorrent:
          condition: service_started
      environment:
        - RADARR_API_KEY=${RADARR_API_KEY}
        - PROWLARR_API_KEY=${PROWLARR_API_KEY}
        - RADARR_PATH=${RADARR_PATH}
        - PROWLARR_PATH=${PROWLARR_PATH}
      volumes:
        - ../service1/media:/media
      networks:
        - proxy-net
      entrypoint:
        - /bin/sh
        - -c
        - |
          echo "Wachten tot Radarr en Prowlarr API online zijn..."
          until curl -sf "http://service1_radarr:7878$${RADARR_PATH}/api/v3/system/status?apikey=$${RADARR_API_KEY}" > /dev/null; do sleep 2; done
          until curl -sf "http://service1_prowlarr:9696$${PROWLARR_PATH}/api/v1/system/status?apikey=$${PROWLARR_API_KEY}" > /dev/null; do sleep 2; done

          mkdir -p /media/movies /media/downloads

          # 1. Voeg /media/movies als root-map toe in Radarr (indien nog niet aanwezig)
          if ! curl -sf "http://service1_radarr:7878$${RADARR_PATH}/api/v3/rootfolder?apikey=$${RADARR_API_KEY}" | grep -q "/media/movies"; then
          curl -sf -X POST "http://service1_radarr:7878$${RADARR_PATH}/api/v3/rootfolder?apikey=$${RADARR_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"path":"/media/movies"}' > /dev/null
          echo "Radarr rootfolder /media/movies toegevoegd."
          fi

          # 2. Koppel qBittorrent als downloadclient in Radarr (indien nog niet aanwezig)
          if ! curl -sf "http://service1_radarr:7878$${RADARR_PATH}/api/v3/downloadclient?apikey=$${RADARR_API_KEY}" | grep -q "qBittorrent"; then
            curl -sf -X POST "http://service1_radarr:7878$${RADARR_PATH}/api/v3/downloadclient?apikey=$${RADARR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{
                "enable": true,
                "protocol": "torrent",
                "priority": 1,
                "name": "qBittorrent",
                "implementation": "QBittorrent",
                "configContract": "QBittorrentSettings",
                "fields": [
                  {"name": "host", "value": "service1_qbittorrent"},
                  {"name": "port", "value": 8081},
                  {"name": "useSsl", "value": false},
                  {"name": "urlBase", "value": ""},
                  {"name": "username", "value": "admin"},
                  {"name": "password", "value": "adminadmin"},
                  {"name": "movieCategory", "value": "radarr"}
                ]
              }' > /dev/null
            echo "qBittorrent gekoppeld aan Radarr."
          fi

          # 3. Koppel Radarr als applicatie in Prowlarr (indien nog niet aanwezig)
          if ! curl -sf "http://service1_prowlarr:9696$${PROWLARR_PATH}/api/v1/applications?apikey=$${PROWLARR_API_KEY}" | grep -q "Radarr"; then
            curl -sf -X POST "http://service1_prowlarr:9696$${PROWLARR_PATH}/api/v1/applications?apikey=$${PROWLARR_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{
                \"syncLevel\": \"fullSync\",
                \"name\": \"Radarr\",
                \"implementation\": \"Radarr\",
                \"configContract\": \"RadarrSettings\",
                \"fields\": [
                  {\"name\": \"prowlarrUrl\", \"value\": \"http://service1_prowlarr:9696$${PROWLARR_PATH}\"},
                  {\"name\": \"baseUrl\", \"value\": \"http://service1_radarr:7878$${RADARR_PATH}\"},
                  {\"name\": \"apiKey\", \"value\": \"$${RADARR_API_KEY}\"},
                  {\"name\": \"syncCategories\", \"value\": [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060]}
                ]
              }" > /dev/null
            echo "Radarr gekoppeld aan Prowlarr."
          fi

          echo "Service 1 koppelingen voltooid!"
    seerr:
        image: ghcr.io/seerr-team/seerr:latest
        container_name: service1_seerr
        init: true
        restart: unless-stopped
        environment:
          - TZ=${TZ}
        volumes:
          - ../service1/seerr/config:/app/config
        labels:
                - "traefik.enable=true"
                # 1. Subpath router met stripprefix
                - "traefik.http.routers.seerr.rule=Host(`${DOMAIN}`) && PathPrefix(`${SEERR_PATH}`)"
                - "traefik.http.routers.seerr.entrypoints=websecure"
                - "traefik.http.routers.seerr.tls=true"
                - "traefik.http.routers.seerr.priority=50"
                - "traefik.http.routers.seerr.middlewares=seerr-strip"
                - "traefik.http.routers.seerr.service=seerr"
                - "traefik.http.middlewares.seerr-strip.stripprefix.prefixes=${SEERR_PATH}"
                # 2. Root-paden router voor Next.js assets, API en /login redirect (zonder stripprefix)
                - "traefik.http.routers.seerr-root.rule=Host(`${DOMAIN}`) && (PathPrefix(`/login`) || PathPrefix(`/_next`) || PathPrefix(`/api/v1`) || PathPrefix(`/images`) || PathPrefix(`/avatarproxy`) || Path(`/manifest.json`) || Path(`/sw.js`) || Path(`/offline`) || Path(`/setup`))"
                - "traefik.http.routers.seerr-root.entrypoints=websecure"
                - "traefik.http.routers.seerr-root.tls=true"
                - "traefik.http.routers.seerr-root.priority=50"
                - "traefik.http.routers.seerr-root.service=seerr"
                # Service poort
                - "traefik.http.services.seerr.loadbalancer.server.port=5055"
        networks:
          - proxy-net


    init-sonarr:
      image: alpine:latest
      container_name: service1_init_sonarr
      environment:
        - SONARR_PATH=${SONARR_PATH:-/service1/sonarr}
      volumes:
        - ../service1/sonarr/config:/config
      command:
        - sh
        - -c
        - |
          mkdir -p /config
          CFG=/config/config.xml
          if [ ! -f "$$CFG" ]; then
            printf '<Config>\n  <UrlBase>%s</UrlBase>\n</Config>\n' "$$SONARR_PATH" > "$$CFG"
          elif grep -q "<UrlBase>" "$$CFG"; then
            sed -i "s|<UrlBase>[^<]*</UrlBase>|<UrlBase>$${SONARR_PATH}</UrlBase>|g" "$$CFG"
          else
            sed -i "s|</Config>|  <UrlBase>$${SONARR_PATH}</UrlBase>\n</Config>|" "$$CFG"
          fi
          chown -R 1000:1000 /config
    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        container_name: service1_sonarr
        environment:
          - PUID=1000
          - PGID=1000
          - TZ=${TZ}
        volumes:
          - ../service1/sonarr/config:/config
          - ../service1/media:/media
        networks:
          - proxy-net
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.sonarr.rule=Host(`${DOMAIN}`) && PathPrefix(`${SONARR_PATH}`)"
            - "traefik.http.routers.sonarr.entrypoints=websecure"
            - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
            - "traefik.http.routers.sonarr.tls=true"

    radarr:
      image: lscr.io/linuxserver/radarr:latest
      container_name: service1_radarr
      depends_on:
        media-init:
          condition: service_completed_successfully
      restart: unless-stopped
      environment:
        - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
        - PUID=1000
        - PGID=1000
        - TZ=${TZ}
        - RADARR__SERVER__URLBASE=${RADARR_PATH}
      volumes:
        - ../service1/radarr/config:/config
        - ../service1/media:/media
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.radarr.rule=Host(`${DOMAIN}`) && PathPrefix(`${RADARR_PATH}`)"
        - "traefik.http.routers.radarr.entrypoints=websecure"
        - "traefik.http.services.radarr.loadbalancer.server.port=7878"
        - "traefik.http.routers.radarr.tls=true"
      networks:
        - proxy-net

    qbittorrent:
      image: lscr.io/linuxserver/qbittorrent:latest
      container_name: service1_qbittorrent
      restart: unless-stopped
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ}
        - WEBUI_PORT=8081
      depends_on:
        qbit-init:
          condition: service_completed_successfully
      volumes:
        - ../service1/qbit/config:/config
        - ../service1/media:/media
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.qbit.rule=Host(`${DOMAIN}`) && PathPrefix(`${QBIT_PATH}`)"
        - "traefik.http.routers.qbit.entrypoints=websecure"
        - "traefik.http.middlewares.strip-qbit.stripprefix.prefixes=${QBIT_PATH}"
        - "traefik.http.routers.qbit.middlewares=strip-qbit"
        - "traefik.http.services.qbit.loadbalancer.server.port=8081"
        - "traefik.http.routers.qbit.tls=true"
        
      networks:
        - proxy-net
    jellyfin-init:
      image: alpine:latest
      container_name: service1_jellyfin_init
      volumes:
        - ../service1/jellyfin/config:/config
      command:
        - sh
        - -c
        - |
          mkdir -p /config/config
          if [ ! -f /config/config/network.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > /config/config/network.xml
            echo '<NetworkConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">' >> /config/config/network.xml
            echo '  <BaseUrl>/service1/jellyfin</BaseUrl>' >> /config/config/network.xml
            echo '  <EnableHttps>false</EnableHttps>' >> /config/config/network.xml
            echo '  <InternalHttpPort>8096</InternalHttpPort>' >> /config/config/network.xml
            echo '  <PublicHttpPort>80</PublicHttpPort>' >> /config/config/network.xml
            echo '  <AutoDiscovery>true</AutoDiscovery>' >> /config/config/network.xml
            echo '  <EnableIPv4>true</EnableIPv4>' >> /config/config/network.xml
            echo '  <EnableRemoteAccess>true</EnableRemoteAccess>' >> /config/config/network.xml
            echo '</NetworkConfiguration>' >> /config/config/network.xml
          fi
    jellyfin:
      image: jellyfin/jellyfin:latest
      container_name: service1_jellyfin
      restart: unless-stopped
      depends_on:
        jellyfin-init:
           condition: service_completed_successfully
      environment:
          - TZ=${TZ}
          - JELLYFIN_PublishedServerUrl=http://${DOMAIN}${JELLYFIN_PATH}
      volumes:
        - ../service1/jellyfin/config:/config
        - ../service1/media:/media
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jellyfin.rule=Host(`${DOMAIN}`) && PathPrefix(`${JELLYFIN_PATH}`)"
        - "traefik.http.routers.jellyfin.entrypoints=websecure"
        - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
        - "traefik.http.routers.jellyfin.tls=true"
      networks:
        - proxy-net

    prowlarr:
      image: lscr.io/linuxserver/prowlarr:latest
      container_name: service1_prowlarr
      restart: unless-stopped
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ}
        - PROWLARR__SERVER__URLBASE=${PROWLARR_PATH}
        - PROWLARR__AUTH__APIKEY=${PROWLARR_API_KEY}
      volumes:
        - ../service1/prowlarr/config:/config
        - ../service1/media:/media
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prowlarr.rule=Host(`${DOMAIN}`) && PathPrefix(`${PROWLARR_PATH}`)"
        - "traefik.http.routers.prowlarr.entrypoints=websecure"
        - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
        - "traefik.http.routers.prowlarr.tls=true"
      networks:
        proxy-net:

  networks:
    proxy-net:
      name: proxy-net
      driver: bridge
         
